<meta name="description" content="PKBOSS13 German Academy - học tiếng Đức từ A0 đến B2: từ vựng, flashcard, ngữ pháp, hội thoại và kiểm tra. Một sản phẩm của PKBOSS13.">
<title>PKBOSS13 German Academy</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0D1626;--s1:#15243A;--s2:#1C3150;--line:#2A4163;--tx:#E9EFF8;--mu:#93A5BF;--gold:#FFC83D;--red:#E5484D;--ok:#3DDC97;
--der:#4DA3FF;--die:#FF6B81;--das:#3DDC97;--disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--body);padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;max-width:560px;margin:0 auto}
.flag{display:grid;gap:2px;width:22px}.flag i{height:6px;border-radius:2px;display:block}
.flag i:nth-child(1){background:#050A12;border:1px solid var(--line)}.flag i:nth-child(2){background:var(--red)}.flag i:nth-child(3){background:var(--gold)}
header b{font:800 17px var(--disp);letter-spacing:.2px}header span{color:var(--mu);font-size:13px;margin-left:auto}
main{max-width:560px;margin:0 auto;padding:4px 18px 24px}
.view{animation:vin .25s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font:800 30px/1.14 var(--disp);margin:8px 0 8px}
h2{font:700 20px var(--disp);margin:26px 0 10px}
p{margin:0 0 12px;color:var(--mu)}.mu{color:var(--mu)}
.by{display:flex;flex-direction:column;gap:2px;margin-top:6px}.by .tag{font:700 12px var(--body);letter-spacing:1.5px;color:var(--gold)}.by b{font:700 15px var(--disp);color:var(--tx)}
.stats{display:flex;gap:10px;margin:14px 0 18px}
.stat{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:800 22px var(--disp);color:var(--gold)}.stat small{color:var(--mu);font-size:12px}
.scene{perspective:900px}
.card{position:relative;height:250px;cursor:pointer;transition:transform .45s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.front{background:linear-gradient(160deg,var(--s2),var(--s1))}
.back{background:var(--s1);transform:rotateY(180deg);border-color:var(--gold)}
.art{font:700 18px var(--disp)}.art.m{color:var(--der)}.art.f{color:var(--die)}.art.n{color:var(--das)}
.word{font:800 38px/1.1 var(--disp);word-break:break-word}
.hint{position:absolute;bottom:12px;font-size:12px;color:var(--mu)}
.vi{font:800 28px/1.2 var(--disp)}.ph{color:var(--gold);margin-top:6px;font-size:15px}.sm{font-size:14px;color:var(--mu);margin-top:6px}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:700 15px var(--body);padding:13px 10px;border-radius:14px;cursor:pointer;min-height:48px}
.btn.pri{background:var(--gold);color:#1A1400;border-color:var(--gold)}.btn:disabled{opacity:.5}
.btn:focus-visible,.opt:focus-visible,.nav button:focus-visible,.chip:focus-visible,summary:focus-visible,.topic:focus-visible,.ib:focus-visible,.tok:focus-visible,.inp:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mu);margin-top:12px;flex-wrap:wrap}.legend b{font-weight:700}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer}
.topic div{flex:1}.topic b{display:block;font:700 17px var(--disp)}.topic small{color:var(--mu)}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.topic em{font-style:normal;font-weight:800;color:var(--gold);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--tx);padding:9px 15px;border-radius:99px;font:500 14px var(--body);cursor:pointer;min-height:40px}
.chip.on{background:var(--gold);color:#1A1400;border-color:var(--gold);font-weight:700}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin:2px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:700 14px var(--body);padding:11px 4px;border-radius:10px;cursor:pointer}.seg button.on{background:var(--gold);color:#1A1400}
.count{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin-bottom:8px}
.q{font:700 24px/1.3 var(--disp);margin:6px 0 16px}.lab{color:var(--gold);font-weight:700;font-size:14px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);color:var(--tx);font:500 17px var(--body);padding:14px;border-radius:14px;margin-bottom:9px;cursor:pointer;min-height:52px}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.14)}.opt.bad{border-color:var(--red);background:rgba(229,72,77,.16)}
.big{font:800 60px var(--disp);color:var(--gold);line-height:1}.end{text-align:center;padding:24px 0 6px}
.inp{width:100%;background:var(--s1);border:1px solid var(--line);color:var(--tx);font:500 17px var(--body);padding:13px 14px;border-radius:14px;margin-bottom:12px;min-height:50px}
.ans{min-height:56px;background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;color:var(--tx)}
.toks{display:flex;flex-wrap:wrap;gap:8px}.tok{background:var(--s2);border:1px solid var(--line);color:var(--tx);font:700 16px var(--body);padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px}.tok:disabled{opacity:.35}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;border:1px solid}.fb.ok{border-color:var(--ok);background:rgba(61,220,151,.1)}.fb.bad{border-color:var(--red);background:rgba(229,72,77,.1)}.fb p{margin:6px 0 0;color:var(--tx)}
.rv{border-left:4px solid;background:var(--s1);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:9px}.rv.ok{border-color:var(--ok)}.rv.bad{border-color:var(--red)}
.wi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.wt{display:flex;gap:10px;align-items:flex-start}.wt>div:first-child{flex:1}.dw{font:800 21px var(--disp)}.vv{font-weight:500}
.ic{display:flex;gap:6px}.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:700 13px var(--body);cursor:pointer}.ib.on{color:var(--gold);border-color:var(--gold)}
.meta{font-size:14px;color:var(--mu);margin-top:6px}.meta b{color:var(--gold);font-weight:600}
.ln{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}.ln .tv{display:none;color:var(--gold);margin-top:6px;font-size:15px}.ln.sh .tv{display:block}.ln b{font:700 13px var(--body);color:var(--mu)}
.fm{background:var(--s2);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:12px 14px;font:700 17px var(--disp);margin:6px 0 12px}
.ex{background:var(--s2);border-radius:12px;padding:10px 12px;margin:8px 0}.ex b{display:block}.ex span{color:var(--mu);font-size:14px}
.sec{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.sec h3{font:700 16px var(--disp);color:var(--gold);margin:0 0 6px}.sec p{color:var(--tx);margin:0}
.note{background:rgba(255,200,61,.1);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.lbl{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}input[type=range]{width:100%;accent-color:var(--gold);height:36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .stat{margin:0}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--s2);border:1px solid var(--gold);border-radius:14px;padding:12px 16px;max-width:90%;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,22,38,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;background:none;border:0;color:var(--mu);font:500 12px var(--body);padding:13px 2px 14px;cursor:pointer;position:relative}
.nav button.on{color:var(--gold);font-weight:700}.nav button.on:before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:6px 18px 18px;max-width:560px;margin:0 auto}footer b{color:var(--tx)}
@media(min-width:768px){header,main,footer,.nav div{max-width:760px}.lvg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){.card,.view{transition:none;animation:none}}
.nav button{font-size:11px}.tg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);margin:0 4px 4px 0}select.inp{appearance:none;-webkit-appearance:none}
</style>
